# Additional arm controllers for the UR5 (a200-0553) that Clearpath does NOT
# generate. They are loaded by arm_controllers.launch.py with the
# controller_manager spawner into the EXISTING manipulators controller_manager:
#   - broadcasters -> ACTIVE (they do not collide).
#   - command controllers (freedrive/forward/passthrough) -> --inactive (they claim
#     the same command interfaces as arm_0_joint_trajectory_controller -> they
#     would collide when active). Switchable at runtime via
#     ur_controller_mode_manager.
#
# The params are taken 1:1 from ur_robot_driver/config/ur_controllers.yaml, with
# tf_prefix 'arm_0_' (instead of $(var tf_prefix)). The file is handed to the
# spawner via --param-file. IMPORTANT (Jazzy format): every controller as a
# '/**/<name>' wildcard node, and the 'type' stands INSIDE its 'ros__parameters'
# (NOT as a separate controller_manager section with an FQN -> this way the
# spawner picks up type + params correctly; the FQN/CM section was NOT adopted ->
# "Failed loading").

# ---- broadcaster params & types --------------------------------------------
/**/force_torque_sensor_broadcaster:
  ros__parameters:
    type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    sensor_name: arm_0_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: arm_0_tool0
    topic_name: ft_data

/**/tcp_pose_broadcaster:
  ros__parameters:
    type: pose_broadcaster/PoseBroadcaster
    frame_id: arm_0_base
    pose_name: arm_0_tcp_pose
    tf:
      child_frame_id: arm_0_tool0_controller

/**/speed_scaling_state_broadcaster:
  ros__parameters:
    type: ur_controllers/SpeedScalingStateBroadcaster
    state_publish_rate: 100.0
    tf_prefix: arm_0_

# ---- command controller params & types -------------------------------------
/**/forward_position_controller:
  ros__parameters:
    type: position_controllers/JointGroupPositionController
    joints:
      - arm_0_shoulder_pan_joint
      - arm_0_shoulder_lift_joint
      - arm_0_elbow_joint
      - arm_0_wrist_1_joint
      - arm_0_wrist_2_joint
      - arm_0_wrist_3_joint

/**/forward_velocity_controller:
  ros__parameters:
    type: velocity_controllers/JointGroupVelocityController
    joints:
      - arm_0_shoulder_pan_joint
      - arm_0_shoulder_lift_joint
      - arm_0_elbow_joint
      - arm_0_wrist_1_joint
      - arm_0_wrist_2_joint
      - arm_0_wrist_3_joint
    interface_name: velocity

/**/freedrive_mode_controller:
  ros__parameters:
    type: ur_controllers/FreedriveModeController
    tf_prefix: arm_0_

/**/passthrough_trajectory_controller:
  ros__parameters:
    type: ur_controllers/PassthroughTrajectoryController
    tf_prefix: arm_0_
    joints:
      - arm_0_shoulder_pan_joint
      - arm_0_shoulder_lift_joint
      - arm_0_elbow_joint
      - arm_0_wrist_1_joint
      - arm_0_wrist_2_joint
      - arm_0_wrist_3_joint
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: arm_0_speed_scaling/speed_scaling_factor
